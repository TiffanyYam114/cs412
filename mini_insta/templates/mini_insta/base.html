<!-- Load the CSS stylesheet -->
{% load static %}

<html>
    <head>
        <title>Mini Insta</title>
        <link rel="stylesheet" href="{% static 'mini_insta_styles.css' %}">
    </head>

    <body>
        <div class="body-container">
            <!-- Page specific content goes here -->
            {% block content %}
            {% endblock %}
        </div>
        <footer>
            {% if profile %}
                <!-- Link to the feed -->
                <li>
                    <a href="{% url 'show_feed' profile.pk %}">
                        <img class="footer-img" src="https://cdn-icons-png.flaticon.com/512/5895/5895964.png" alt="">
                    </a>
                </li>
            {% else %}
                <!-- Link to the home page -->
                <li>
                    <a href="{% url 'show_all_profiles' %}">
                        <img class="footer-img" src="https://cdn-icons-png.flaticon.com/512/5895/5895964.png" alt="">
                    </a>
                </li>
            {% endif %}


            {% if profile %}
            <!-- Link to the search page -->
            <li>
                <a href="{% url 'search' profile.pk %}">
                    <img class="footer-img" src="https://www.iconpacks.net/icons/1/free-search-icon-957-thumb.png" alt="">
                </a>
            </li>

            <!-- Link to go to the Profile page -->
            <li>
                <a href="{% url 'show_profile' profile.pk %}">
                    <img class="footer-img" src="{{profile.profile_image_url}}" alt="">
                </a>
            </li>

            <!-- Link to create a new post -->
                <a href="{% url 'create_post' profile.pk %}">
                    <img class="footer-img" src="https://static.vecteezy.com/system/resources/previews/000/377/812/non_2x/plus-vector-icon.jpg" alt="">
                </a>
            {% elif post %}
            <!-- Link to the search page -->
            <li>
                <a href="{% url 'search' post.profile.pk %}">
                    <img class="footer-img" src="https://www.iconpacks.net/icons/1/free-search-icon-957-thumb.png" alt="">
                </a>
            </li>

            <!-- Link to go to the Profile page -->
            <li>
                <a href="{% url 'show_profile' post.profile.pk %}">
                    <img class="footer-img" src="{{post.profile.profile_image_url}}" alt="">
                </a>
            </li>

            <!-- Link to create a new post -->
                <a href="{% url 'create_post' post.profile.pk %}">
                    <img class="footer-img" src="https://static.vecteezy.com/system/resources/previews/000/377/812/non_2x/plus-vector-icon.jpg" alt="">
                </a>
            {% endif %}
        </footer>
    </body>
</html>
