<!-- Load the base template -->
{% extends 'mini_insta/base.html' %}

<!-- Custom content -->
{% block content %}
<h1>Update this Post</h1>

<form action="" method="POST">
    {% csrf_token %}
    <table>
        {{form.as_table}}
    </table>

    <input type="submit" value="Update">
</form>

<!-- Add a separate form for a cancel button -->
<form action="{% url 'show_post' post.pk %}" method="GET">
    <input type="submit" value="Cancel">
</form>
{% endblock %}
