<!-- Load the base template -->
{% extends 'mini_insta/base.html' %}

<!-- Custom content -->
{% block content %}
<div>
    <form action="{% url 'search' profile.pk %}">
        {% csrf_token %}
        <h2>Search for people, posts, or text:</h2>
        <input type="text" name="query">

        <input type="submit" value="Search">
    </form>
</div>
{% endblock %}
