{% extends 'mini_insta/base.html' %}

{% block content %}
<h1>Update this Profile</h1>

<!-- Display the HTML form -->
<form action="{% url 'update_profile' profile.pk %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <table>
        {{form.as_table}}
    </table>

    <input type="submit" value="Update">
</form>

<!-- Add a separate form for a cancel button -->
<form action="{% url 'show_profile' profile.pk %}" method="GET">
    <input type="submit" value="Cancel">
</form>

{% endblock %}
