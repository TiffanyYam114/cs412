{% extends 'blog/base.html' %}

{% block content %}
<h1>Showing all articles</h1>

<!-- This displays the QuerySet of all articles. -->
<!-- {{articles}} -->

<main class="grid-container">
    <!-- Scriplet code for a loop -->
    {% for article in articles %}
    <article>
        <div>
            <h2>{{article.title}}</h2>
            <h3>By {{article.author}}</h3>
            <p>{{article.text}}</p>
        </div>

        <!-- Create a link to show this one article only -->
        <a href="{% url 'article' article.pk %}">
            <!-- <img src="{{article.image_url}}" alt=""> -->
            {% if article.image_file %}
            <img src="{{article.image_file.url}}" alt="">
            {% else %}
            <h3>No Image</h3>
            {% endif %}
        </a>
    </article>
    <hr>
    {% endfor %}
</main>
{% endblock %}
