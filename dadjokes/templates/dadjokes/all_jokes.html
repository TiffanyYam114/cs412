<!-- Load the base template -->
{% extends 'dadjokes/base.html' %}

<!-- Page specific content -->
{% block content %}
<div class="container">
    <h1>All Jokes</h1>
    <!-- Loop through all jokes and display information -->
    {% for joke in jokes %}
        <h3>{{joke.text|linebreaksbr}}</h3>
        <p>Joke added by {{joke.name}}</p>
        <hr>
    {% endfor %}
</div>
{% endblock %}
